/*
 * Multiwarden: build settings on top of Bitwarden's app/build.gradle.kts, which applies this file
 * at its end.
 *
 * - Own application ID, so Multiwarden installs next to the official Bitwarden app.
 * - Version: the Bitwarden version plus Multiwarden's release number, both from
 *   multiwarden/version.json (2026.11.1 release 2 -> versionName 2026.11.1.2).
 * - App name and launcher icon from multiwarden/android/, added as each variant's
 *   highest-priority resources so they win over Bitwarden's build-type resources.
 * - Only the F-Droid flavor is built: the standard flavor's Firebase setup belongs to
 *   Bitwarden's application ID, and Multiwarden does not use Google services.
 * - Release signing from the MULTIWARDEN_KEYSTORE_* environment variables when they are set
 *   (CI sets them from repository secrets; see multiwarden/README.md).
 * - Release builds also produce one APK per CPU type next to the universal APK, and native
 *   libraries are stored compressed. Bitwarden's SDK library is about 30 MB per CPU type, so
 *   this takes a download from about 150 MB (universal, uncompressed) to under 40 MB.
 */
import groovy.json.JsonSlurper

def multiwardenVersion = new JsonSlurper().parse(rootProject.file("multiwarden/version.json"))
def (bitwardenYear, bitwardenMonth, bitwardenPatch) =
    multiwardenVersion.bitwarden.tokenize(".").collect { it as int }
def multiwardenRelease = multiwardenVersion.release as int

android {
    defaultConfig {
        applicationId = "com.multiwarden.android"
        versionName = "${multiwardenVersion.bitwarden}.${multiwardenRelease}"
        // 2026.11.1 release 2 -> 2026110102; always higher than the previous release.
        versionCode = bitwardenYear * 1000000 + bitwardenMonth * 10000 +
            bitwardenPatch * 100 + multiwardenRelease
    }
    // Compressed native libraries: a smaller download, at the cost of Android extracting them
    // on install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // One APK per CPU type, plus the universal APK. Only for release builds, so debug builds
    // stay a single APK. All APKs share the version code; app stores and Obtainium pick the
    // one that matches the device.
    splits {
        abi {
            enable = gradle.startParameter.taskNames.any { it.contains("Release") }
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk = true
        }
    }
}

def keystoreFile = System.getenv("MULTIWARDEN_KEYSTORE_FILE")
if (keystoreFile) {
    android {
        signingConfigs {
            create("multiwarden") {
                storeFile = file(keystoreFile)
                storePassword = System.getenv("MULTIWARDEN_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("MULTIWARDEN_KEY_ALIAS")
                keyPassword = System.getenv("MULTIWARDEN_KEY_PASSWORD")
            }
        }
        buildTypes {
            release {
                signingConfig = signingConfigs.getByName("multiwarden")
            }
        }
    }
}

androidComponents {
    beforeVariants(selector().withFlavor(new kotlin.Pair("mode", "standard"))) { variant ->
        variant.enable = false
    }
    onVariants(selector().all()) { variant ->
        // app/build.gradle.kts names every output <application ID>-<flavor>.apk; give the
        // per-CPU APKs their CPU type as a suffix so they don't overwrite each other.
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType.toString() == "ABI" }?.identifier
            if (abi) {
                output.outputFileName.set(
                    "${variant.applicationId.get()}-${variant.flavorName}-${abi}.apk"
                )
            }
        }
        def resources = variant.sources.res
        resources.addStaticSourceDirectory(rootProject.file("multiwarden/android/res").path)
        resources.addStaticSourceDirectory(
            rootProject.file("multiwarden/android/res-${variant.buildType}").path
        )
    }
}
